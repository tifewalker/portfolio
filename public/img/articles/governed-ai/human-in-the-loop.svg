<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Human-in-the-loop escalation flow for high-risk customer support actions">
<title>Human-in-the-loop escalation flow for high-risk customer support actions</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
  </marker>
  <marker id="aht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
  </marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.08"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="80" y="64" width="6" height="34" rx="3" fill="#0D9488"/><text x="100" y="91" text-anchor="start" font-size="28" font-weight="700" fill="#0B1F3A">Human-in-the-loop escalation</text>
<rect x="80" y="340" width="240" height="160" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(180.0,378.0) scale(1.0)"><path d="M6 8 h28 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-16 l-8 7 v-7 h-4 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4z" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="200.0" y="444.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Customer</text>
<text x="200.0" y="470.0" text-anchor="middle" font-size="16" fill="#64748B">request arrives</text>
<line x1="322" y1="420" x2="400" y2="420" stroke="#1E3A5F" stroke-width="3" marker-end="url(#ah)"/>
<rect x="402" y="330" width="250" height="180" rx="20" fill="#0B1F3A" filter="url(#sh)"/>
<g transform="translate(503.0,366.0) scale(1.2)"><path d="M20 4 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4z" fill="none" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="527" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">AI agent</text>
<text x="527" y="478" text-anchor="middle" font-size="15" font-weight="500" fill="#CCFBF1">answers or prepares</text>
<line x1="654" y1="420" x2="706" y2="420" stroke="#1E3A5F" stroke-width="3" marker-end="url(#ah)"/>
<path d="M830 300 L950 420 L830 540 L710 420 Z" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3" filter="url(#sh)"/>
<g transform="translate(812.0,382.0) scale(0.9)"><path d="M20 5 l16 29 h-32z" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15 v9" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="29" r="1.6" fill="#0D9488"/></g>
<text x="830" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#0B1F3A">Risk check</text>
<path d="M830 300 V 200 H 1060" fill="none" stroke="#0D9488" stroke-width="3" stroke-linejoin="round" marker-end="url(#aht)"/>
<rect x="865.0" y="164" width="110" height="32" rx="16" fill="#CCFBF1"/><text x="920" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#0F766E">low risk</text>
<rect x="1062" y="140" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(1242.0,158.0) scale(1.0)"><circle cx="20" cy="20" r="15" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 20 l5 5 l9 -10" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1262.0" y="224.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Respond automatically</text>
<text x="1262.0" y="250.0" text-anchor="middle" font-size="16" fill="#64748B">grounded and logged</text>
<path d="M950 420 H 1060" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="950.0" y="374" width="110" height="32" rx="16" fill="#F1F5F9"/><text x="1005" y="396" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">high risk</text>
<rect x="1062" y="360" width="400" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(1242.0,383.0) scale(1.0)"><path d="M14 10 h20 M14 20 h20 M14 30 h20" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="10" r="1.8" fill="#0D9488"/><circle cx="7" cy="20" r="1.8" fill="#0D9488"/><circle cx="7" cy="30" r="1.8" fill="#0D9488"/></g>
<text x="1262.0" y="449.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Approval queue</text>
<text x="1262.0" y="475.0" text-anchor="middle" font-size="16" fill="#64748B">context + recommendation</text>
<line x1="1262" y1="492" x2="1262" y2="560" stroke="#1E3A5F" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1062" y="562" width="400" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(1242.0,585.0) scale(1.0)"><circle cx="20" cy="13" r="7" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 36 c0 -8 6 -13 13 -13 s13 5 13 13" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1262.0" y="651.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Authorised person</text>
<text x="1262.0" y="677.0" text-anchor="middle" font-size="16" fill="#64748B">approves, edits or rejects</text>
<path d="M1062 627 H 527 V 512" fill="none" stroke="#0D9488" stroke-width="3" stroke-dasharray="8 7" stroke-linejoin="round" marker-end="url(#aht)"/>
<text x="800" y="615" text-anchor="middle" font-size="16" font-weight="500" fill="#64748B">decision returns with full history</text>
<text x="80" y="600" text-anchor="start" font-size="15" font-weight="700" fill="#64748B">ESCALATE WHEN</text>
<rect x="62.0" y="624" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="150" y="646" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">asks for a human</text>
<rect x="252.0" y="624" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="340" y="646" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">knowledge gap</text>
<rect x="62.0" y="670" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="150" y="692" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">dispute</text>
<rect x="252.0" y="670" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="340" y="692" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">policy exception</text>
<rect x="62.0" y="716" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="150" y="738" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">refund or payment</text>
<rect x="252.0" y="716" width="176" height="32" rx="16" fill="#F1F5F9"/><text x="340" y="738" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">low confidence</text>
</g>
</svg>
