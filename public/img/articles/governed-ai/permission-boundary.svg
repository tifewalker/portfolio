<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="AI agent permission boundary: model suggestions versus backend-enforced actions">
<title>AI agent permission boundary: model suggestions versus backend-enforced actions</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
  </marker>
  <marker id="aht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
  </marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.08"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="80" y="64" width="6" height="34" rx="3" fill="#0D9488"/><text x="100" y="91" text-anchor="start" font-size="28" font-weight="700" fill="#0B1F3A">Prompts are not permissions</text>
<rect x="80" y="170" width="560" height="560" rx="26" fill="#F1F5F9"/>
<text x="110" y="210" text-anchor="start" font-size="16" font-weight="700" fill="#64748B">MODEL SPACE  ·  suggests</text>
<rect x="960" y="170" width="560" height="560" rx="26" fill="#F0FDFA"/>
<text x="1490" y="210" text-anchor="end" font-size="16" font-weight="700" fill="#0F766E">APPLICATION SPACE  ·  enforces</text>
<line x1="800" y1="150" x2="800" y2="760" stroke="#0B1F3A" stroke-width="3" stroke-dasharray="12 10"/>
<rect x="715.0" y="774" width="170" height="32" rx="16" fill="#0B1F3A"/><text x="800" y="796" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Trust boundary</text>
<rect x="150" y="300" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(340.0,333.0) scale(1.0)"><path d="M20 4 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4z" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360.0" y="399.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">AI model</text>
<text x="360.0" y="425.0" text-anchor="middle" font-size="16" fill="#64748B">proposes an action</text>
<rect x="190" y="500" width="340" height="90" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="538" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A5F">issue_refund(order, amount)</text>
<text x="360" y="566" text-anchor="middle" font-size="15" font-weight="500" fill="#64748B">untrusted tool call</text>
<path d="M530 545 H 620 V 375 H 686" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="690" y="290" width="220" height="170" rx="20" fill="#0B1F3A" filter="url(#sh)"/>
<g transform="translate(774.0,319.0) scale(1.3)"><path d="M20 4 l14 5 v10 c0 9 -6 15 -14 18 c-8 -3 -14 -9 -14 -18 v-10z" fill="none" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 20 l4 4 l8 -8" fill="none" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="800" y="405" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Policy engine</text>
<text x="800" y="432" text-anchor="middle" font-size="15" font-weight="500" fill="#CCFBF1">role · scope · limits</text>
<path d="M910 340 H 1060" fill="none" stroke="#0D9488" stroke-width="3" stroke-linejoin="round" marker-end="url(#aht)"/>
<rect x="1062" y="270" width="380" height="130" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(1232.0,293.0) scale(1.0)"><circle cx="20" cy="20" r="15" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 20 l5 5 l9 -10" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1252.0" y="359.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Execute</text>
<text x="1252.0" y="385.0" text-anchor="middle" font-size="16" fill="#64748B">logged with who and why</text>
<path d="M910 420 H 985 V 560 H 1058" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1062" y="490" width="380" height="140" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(1232.0,518.0) scale(1.0)"><circle cx="20" cy="20" r="15" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 14 l12 12 M26 14 l-12 12" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1252.0" y="584.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0B1F3A">Reject or escalate</text>
<text x="1252.0" y="610.0" text-anchor="middle" font-size="16" fill="#64748B">explain limit · request approval</text>
<rect x="935.0" y="304" width="100" height="32" rx="16" fill="#CCFBF1"/><text x="985" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#0F766E">allowed</text>
<rect x="1062.0" y="439" width="96" height="32" rx="16" fill="#F1F5F9"/><text x="1110" y="461" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">denied</text>
</g>
</svg>
